# fly.toml app configuration file generated for bot-discord-invitar-gente on 2026-08-20T19:10:16Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'bot-discord-invitar-gente'
primary_region = 'ams'
swap_size_mb = 256

[build]
  builder = 'paketobuildpacks/builder:base'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
  processes = ['app']
  size = 'shared-cpu-1x'
